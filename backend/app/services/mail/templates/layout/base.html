{#- Shared email layout, styled after the website (Nuxt UI, teal primary,
    olive neutrals, Nunito). Email clients ignore most <style> rules, so
    everything that matters is inlined. -#}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{% block title %}TransAct{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; }
        a { color: #00786f; }
        @media (max-width: 620px) {
            .container { padding: 24px 12px !important; }
            .card { padding: 28px 20px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f4f0;">
        <tr>
            <td align="center" class="container" style="padding: 40px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; font-family: 'Nunito', Arial, Helvetica, sans-serif; font-weight: 500; font-size: 15px; line-height: 1.6; color: #474739;">
                    <tr>
                        <td style="padding: 0 4px 20px;">
                            <a href="{{ frontend_url }}" style="text-decoration: none; color: #1d1d16;">
                                <img src="{{ frontend_url }}/transact_logo_dark.png" alt="" width="28" height="25" style="vertical-align: middle; border: 0;">
                                <span style="vertical-align: middle; margin-left: 8px; font-size: 17px; font-weight: 800; color: #1d1d16;">TransAct</span>
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td class="card" style="background-color: #ffffff; border: 1px solid #e8e8e3; border-radius: 12px; padding: 36px 32px;">
                            <h1 style="margin: 0 0 20px; font-size: 22px; line-height: 1.3; font-weight: 800; color: #1d1d16;">{{ self.title() }}</h1>
                            {% block content %}{% endblock %}
                            <p style="margin: 24px 0 0;">The TransAct Team</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 20px 4px 0; font-size: 12px; line-height: 1.5; color: #7c7c67;">
                            This email was sent by the <a href="{{ frontend_url }}" style="color: #7c7c67;">TransAct Repository</a>.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
