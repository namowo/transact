services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transact_test
      POSTGRES_PASSWORD: transact_test
      POSTGRES_DB: transact_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transact_test"]
      interval: 2s
      timeout: 5s
      retries: 20
