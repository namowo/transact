name: Update Python packages

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  update-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Update lockfile
        run: uv lock --upgrade

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: monthly python package updates"
          title: "chore: monthly python package updates"
          body: Automated monthly update of Python dependencies (`uv lock --upgrade`).
          branch: chore/python-updates
          delete-branch: true
