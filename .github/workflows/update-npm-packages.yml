name: Update npm packages

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  update-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update root packages
        run: npm update

      - name: Update frontend packages
        working-directory: frontend
        run: npm update

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: monthly npm package updates"
          title: "chore: monthly npm package updates"
          body: Automated monthly update of npm dependencies (`npm update`) in the root and `frontend` projects.
          branch: chore/npm-updates
          delete-branch: true
