name: Deploy to Test

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag being deployed (informational only)'
        required: false
        type: string
        default: manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Pull latest changes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git checkout -- uv.lock
            git pull origin main

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            cd ${{ secrets.DEPLOY_PATH }}
            uv sync --frozen
            uv run --directory backend alembic upgrade head
            sudo systemctl restart transact

      - name: Deploy frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            nvm use default
            cd ${{ secrets.DEPLOY_PATH }}/frontend
            npm ci
            npm run build
